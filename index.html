<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 상세 페이지</title>
<style>
  html {
    scroll-behavior: smooth;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #10131a;
  }
  html, body {
    width: 100%;
    overflow-x: hidden;
  }
  .page-wrap {
    position: relative;
    width: 100%;
    line-height: 0;
  }
  .page-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }
  .buy-btn {
    position: absolute;
    left: 27%;
    width: 48%;
    top: 99.25%;
    height: 0.4%;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="top"></div>
<div class="page-wrap">
  <img src="260903.jpg" alt="상품 상세 페이지">
  <a href="#top" class="buy-btn" aria-label="시리즈 구매하기 - 맨 위로 이동"></a>
</div>
</body>
</html>
